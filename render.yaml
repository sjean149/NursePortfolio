databases:
  - name: nurse-portfolio-db
    plan: free
    databaseName: nurse_portfolio
    user: nurse_portfolio

services:
  - type: web
    name: nurse-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nurse-portfolio-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: nurse-portfolio-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the API's Render URL, e.g. https://nurse-portfolio-api.onrender.com
      - key: VITE_API_URL
        sync: false
